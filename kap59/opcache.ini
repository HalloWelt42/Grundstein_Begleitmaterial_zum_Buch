; Kern einer OPcache-Konfiguration für Produktion.
; Diese Datei wird in ein Verzeichnis wie conf.d der PHP-Installation gelegt
; oder mit -c beim Start eingebunden.

; Den Cache überhaupt einschalten.
opcache.enable=1

; Gemeinsamer Speicher für die Opcodes, in Megabyte.
opcache.memory_consumption=128

; Gemeinsamer Puffer für wiederkehrende Zeichenketten (Klassen-, Methoden-,
; Funktionsnamen), in Megabyte.
opcache.interned_strings_buffer=16

; Obergrenze für die Zahl zwischengespeicherter Dateien - großzügig wählen.
opcache.max_accelerated_files=20000

; In Produktion: keine Prüfung auf geänderte Dateien bei jeder Anfrage.
; Beim Ausrollen einer neuen Version leert man den Cache einmal bewusst.
opcache.validate_timestamps=0
