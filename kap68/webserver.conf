# =====================================================================
#  Reverse-Proxy vor PHP-FPM (Kapitel 68, Auszug).
#  Statische Dateien liefert der Webserver selbst aus; alles Dynamische
#  reicht er als FastCGI an den FPM-Dienst weiter. Ausgeführt werden nur
#  die beiden ausdrücklich freigegebenen PHP-Dateien - alles andere ist
#  gesperrt (Whitelist statt Blacklist).
# =====================================================================

# Der FPM-Dienst ist im selben Netz unter diesem Namen und Port erreichbar.
upstream php_backend {
    server app:9000;
}

server {
    listen 80;
    server_name _;

    # Die Web-Wurzel ist ausschließlich public/ - der übrige Code liegt
    # daneben und ist so vom Browser gar nicht erst erreichbar.
    root /app/public;
    index index.php;

    # Statische Dateien direkt ausliefern, sonst an den Front Controller.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Nur genau diese beiden Skripte dürfen ausgeführt werden.
    location ~ ^/(index|health)\.php$ {
        fastcgi_pass php_backend;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
