; =====================================================================
;  OPcache-Einstellungen für den Betrieb (Kapitel 68, Rückbezug 59).
;  Im Betrieb gilt: Cache an, keine ständige Datei-Prüfung, optional
;  Preloading. Beim Ausrollen einer neuen Version wird der Cache einmal
;  bewusst geleert (frischer Container = frischer Cache).
; =====================================================================

; Den Opcode-Cache einschalten.
opcache.enable = 1

; Gemeinsamer Speicher für die Opcodes, in Megabyte.
opcache.memory_consumption = 128

; Puffer für wiederkehrende Zeichenketten (Klassen-, Methoden-, Namen).
opcache.interned_strings_buffer = 16

; Obergrenze für zwischengespeicherte Dateien - großzügig wählen.
opcache.max_accelerated_files = 20000

; Der entscheidende Betriebsschalter: KEINE Prüfung auf geänderte
; Dateien bei jeder Anfrage. In der Entwicklung steht hier 1, im Betrieb 0.
opcache.validate_timestamps = 0

; Preloading: Klassen einmalig beim Start dauerhaft in den Speicher legen
; (Kapitel 59). preload_user ist nötig, weil der Start als root läuft.
opcache.preload = /app/preload.php
opcache.preload_user = www-data
