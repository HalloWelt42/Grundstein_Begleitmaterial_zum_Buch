; =====================================================================
;  FPM-Pool-Konfiguration für den Betrieb (Kapitel 68).
;  Ersetzt den mitgelieferten Standardpool. Der wichtigste Hebel ist die
;  Prozesszahl: Jeder FPM-Prozess beantwortet genau eine Anfrage zur Zeit,
;  also begrenzt pm.max_children, wie viele Anfragen gleichzeitig laufen.
; =====================================================================
[www]

; FPM-Prozesse laufen unprivilegiert - nie als root.
user  = www-data
group = www-data

; Auf allen Schnittstellen lauschen; nur der Reverse-Proxy im selben Netz
; spricht diesen Port an, nach außen ist er nicht veröffentlicht.
listen = 9000

; "dynamic": FPM hält eine Grundlast an Prozessen bereit und startet bei
; Andrang weitere hinzu, bis zur Obergrenze.
pm = dynamic

; Obergrenze: Faustregel ist verfügbarer Speicher geteilt durch den
; Speicherbedarf eines Prozesses. Zu hoch gewählt bringt der Andrang den
; Server ins Schwitzen, zu niedrig warten Anfragen unnötig.
pm.max_children = 20

; Beim Start bereitgehaltene Prozesse und das erlaubte Polster im Leerlauf.
pm.start_servers     = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6

; Jeder Prozess beendet sich nach so vielen Anfragen freiwillig und wird
; frisch neu gestartet - eine Vorsichtsmaßnahme gegen langsam wachsenden
; Speicher (dieselbe Idee wie beim Worker aus Kapitel 61).
pm.max_requests = 500

; Ausgaben der Prozesse (STDOUT/STDERR) an FPM durchreichen, damit sie im
; Container-Protokoll landen statt in einer Datei zu versickern.
catch_workers_output = yes
decorate_workers_output = no
